plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.107'
    id 'idea'
}

group = mod_group_id
version = mod_version

def includeComputerCraftRuntime = providers.gradleProperty('includeComputerCraftRuntime')
        .map { it.toBoolean() }
        .getOrElse(false)
def includeKubeJsRuntime = providers.gradleProperty('includeKubeJsRuntime')
        .map { it.toBoolean() }
        .getOrElse(false)
def includeCreateBigCannonsRuntime = providers.gradleProperty('includeCreateBigCannonsRuntime')
        .map { it.toBoolean() }
        .getOrElse(false)

base {
    archivesName = "createpropulsion-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

sourceSets.main.resources {
    srcDirs = ['src/main/resources', 'src/generated/resources']
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    validateAccessTransformers = true

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    mixin {
        add sourceSets.main, 'createpropulsion.refmap.json'
        config 'createpropulsion.mixins.json'
    }

    mods {
        createpropulsion {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
        }
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'veil.disableImgui', 'true'
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument('--nogui')
        }
        compatClient {
            client()
            gameDirectory = project.file('run/compat-client')
            systemProperty 'veil.disableImgui', 'true'
        }
        compatServer {
            server()
            gameDirectory = project.file('run/compat-server')
            programArgument('--nogui')
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', mod_id, '--all', '--output',
                    file('src/generated/resources/').absolutePath, '--existing',
                    file('src/main/resources/').absolutePath
        }
    }
}

repositories {
    flatDir { dirs 'libs', 'compileOnlyLibs' }
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/mirror' }
    maven { url = 'https://maven.ryanhcode.dev/releases' }
    maven { url = 'https://maven.firstdark.dev/snapshots' }
    maven { url = 'https://maven.shedaniel.me' }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
        content { includeGroup 'thedarkcolour' }
    }
    maven {
        name = 'SquidDev'
        url = 'https://maven.squiddev.cc/'
        content {
            includeGroup 'cc.tweaked'
            includeModule 'org.squiddev', 'Cobalt'
        }
    }
    maven {
        name = 'Latvian'
        url = 'https://maven.latvian.dev/releases'
        content {
            includeGroup 'dev.latvian.mods'
            includeGroup 'dev.latvian.apps'
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

legacyForge.runs.configureEach {
    additionalRuntimeClasspathConfiguration.extendsFrom(configurations.localRuntime)
}

dependencies {
    // Exact named development artifacts from the read-only formal ports.
    // Production game instances must use their production distribution JARs.
    modImplementation(name: "sable-forge-${minecraft_version}-${sable_version}-dev", ext: 'jar')
    modImplementation(name: "simulated-forge-${minecraft_version}-${simulated_version}-dev", ext: 'jar')
    modImplementation(name: "aeronautics-forge-${minecraft_version}-${aeronautics_version}-dev", ext: 'jar')
    modImplementation(name: "offroad-forge-${minecraft_version}-${offroad_version}-dev", ext: 'jar')
    modImplementation(name: "Veil-forge-${minecraft_version}-${veil_version}-dev", ext: 'jar')

    modImplementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modCompileOnly("dev.engine-room.flywheel:flywheel-forge-api-${minecraft_version}:${flywheel_version}")
    modRuntimeOnly("dev.engine-room.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}")
    modImplementation("net.createmod.ponder:Ponder-Forge-${minecraft_version}:${ponder_version}")
    modRuntimeOnly("thedarkcolour:kotlinforforge:${kotlinforforge_version}")

    compileOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}")
    if (includeComputerCraftRuntime) {
        modRuntimeOnly("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}")
    }

    compileOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}")
    if (includeKubeJsRuntime) {
        modRuntimeOnly("dev.latvian.mods:kubejs-forge:${kubejs_version}")
        // KubeJS publishes these as mandatory mod dependencies. Legacy ModDev does not
        // carry them from modRuntimeOnly into the run configuration automatically.
        modRuntimeOnly("dev.architectury:architectury-forge:${kubejs_architectury_version}")
        modRuntimeOnly("dev.latvian.mods:rhino-forge:${kubejs_rhino_version}") {
            transitive = false
        }
    }

    // Optional Create 6 / Forge 1.20.1 compatibility target. Modrinth
    // artifact ZRgu5o3x is the audited CBC 5.11.4 release.
    modCompileOnly("maven.modrinth:GWp4jCJj:${create_big_cannons_artifact}") {
        transitive = false
    }
    if (includeCreateBigCannonsRuntime) {
        modRuntimeOnly("maven.modrinth:GWp4jCJj:${create_big_cannons_artifact}") {
            transitive = false
        }
        // CBC declares Ritchie's Projectile Library as a mandatory runtime mod, but
        // Modrinth's Maven POM does not carry mod dependency metadata into this run.
        modRuntimeOnly("maven.modrinth:rpl:${ritchies_projectile_library_artifact}") {
            transitive = false
        }
    }

    // Runtime libraries normally shaded into Veil's full production JAR.
    runtimeOnly "gg.moonflower:molang-compiler:${molang_compiler_version}"
    runtimeOnly "io.github.spair:imgui-java-binding:${imgui_version}"
    runtimeOnly("io.github.spair:imgui-java-lwjgl3:${imgui_version}") {
        exclude group: 'org.lwjgl'
        exclude group: 'org.lwjgl.lwjgl'
    }
    runtimeOnly "io.github.spair:imgui-java-natives-windows:${imgui_version}"
    runtimeOnly("org.lwjgl:lwjgl-opencl:${lwjgl_version}") { transitive = false }
    runtimeOnly("org.lwjgl:lwjgl-shaderc:${lwjgl_version}") { transitive = false }
    runtimeOnly "org.lwjgl:lwjgl-shaderc:${lwjgl_version}:natives-windows"

    implementation 'org.joml:joml:1.10.5'
    implementation 'org.joml:joml-primitives:1.10.0'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
    implementation "dev.vfyjxf:taffy:${taffy_version}"
    localRuntime "dev.vfyjxf:taffy:${taffy_version}"
    jarJar("dev.vfyjxf:taffy:[${taffy_version}]") {
        transitive = false
    }

    compileOnly 'org.jetbrains:annotations:24.1.0'
    compileOnly(annotationProcessor('org.spongepowered:mixin:0.8.5:processor'))

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs.addAll(['-Xmaxerrs', '3000'])
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            create_version_range: create_version_range,
            flywheel_version_range: flywheel_version_range,
            veil_version_range: veil_version_range,
            sable_version_range: sable_version_range,
            simulated_version_range: simulated_version_range,
            aeronautics_version_range: aeronautics_version_range,
            offroad_version_range: offroad_version_range,
            cc_version_range: cc_version_range,
            kubejs_version_range: kubejs_version_range,
            create_big_cannons_version_range: create_big_cannons_version_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact(tasks.named('jar'))
            artifact(tasks.named('sourcesJar'))
        }
    }
    repositories {
        maven { url = layout.buildDirectory.dir('repo') }
    }
}
