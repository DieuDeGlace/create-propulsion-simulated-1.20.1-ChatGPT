name: Source checkpoint checks

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checkpoint:
    name: Source checkpoint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check committed diff formatting
        run: git diff-tree --check --no-commit-id -r -m --root HEAD

      - name: Verify wrapper and Java startup
        run: ./gradlew --version --no-daemon

      - name: Record build boundary
        shell: bash
        run: |
          {
            echo "### Build boundary"
            echo
            echo "The public source checkout does not contain the five hash-locked named development JARs."
            echo "A full Forge build is performed only by the verified local release script or from its minimal-workspace archive."
            echo "See docs/DEPENDENCY_MAP.md and docs/VALIDATION.md."
          } >> "${GITHUB_STEP_SUMMARY}"
